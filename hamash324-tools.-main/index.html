<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYTE - لوحة التحكم التقنية</title>
    <!-- استخدام Tailwind CSS للتصميم السريع والمتجاوب -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- شريط التنقل العلوي -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center">
        <div class="flex items-center space-x-3 space-x-reverse">
            <span class="bg-blue-600 text-white px-3 py-1 rounded-lg font-bold text-lg">BYTE</span>
            <span class="text-sm text-gray-400">لوحة التحكم</span>
        </div>
        <div>
            <a href="index.html" class="bg-gray-800 hover:bg-gray-700 text-sm px-3 py-2 rounded-lg transition">
                <i class="fa-solid fa-house ml-1"></i> الرئيسية
            </a>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 p-4 max-w-6xl mx-auto w-full space-y-6">
        
        <!-- قسم الترحيب والإحصائيات السريعة -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl shadow">
                <div class="text-gray-400 text-sm">حالة الخادم</div>
                <div class="text-2xl font-bold text-green-400 mt-1">متصل (Online)</div>
            </div>
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl shadow">
                <div class="text-gray-400 text-sm">الأدوات النشطة</div>
                <div class="text-2xl font-bold text-blue-400 mt-1">أدوات 12</div>
            </div>
            <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl shadow">
                <div class="text-gray-400 text-sm">إصدار النظام</div>
                <div class="text-2xl font-bold text-purple-400 mt-1">v2.4 Pro</div>
            </div>
        </section>

        <!-- إدارة الأدوات والسكربتات -->
        <section class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow">
            <h2 class="text-lg font-bold mb-4 border-b border-gray-800 pb-2">إدارة الأدوات السريعة</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                
                <!-- أداة 1 -->
                <div class="bg-gray-950 p-4 rounded-lg border border-gray-800 flex justify-between items-center">
                    <div>
                        <h3 class="font-semibold text-blue-300">محلل السكربتات</h3>
                        <p class="text-xs text-gray-400 mt-1">فحص وتحليل الأخطاء البرمجية تلقائياً.</p>
                    </div>
                    <button class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-2 rounded transition">تشغيل</button>
                </div>

                <!-- أداة 2 -->
                <div class="bg-gray-950 p-4 rounded-lg border border-gray-800 flex justify-between items-center">
                    <div>
                        <h3 class="font-semibold text-blue-300">مولد الروابط والـ Tokens</h3>
                        <p class="text-xs text-gray-400 mt-1">إدارة بيانات الربط والتوكنات بأمان.</p>
                    </div>
                    <button class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-2 rounded transition">إدارة</button>
                </div>

            </div>
        </section>

    </main>

    <!-- تذييل الصفحة -->
    <footer class="bg-gray-900 border-t border-gray-800 text-center py-4 text-xs text-gray-500">
        جميع الحقوق محفوظة لصالح BYTE التقنية
    </footer>

</body>
</html>
